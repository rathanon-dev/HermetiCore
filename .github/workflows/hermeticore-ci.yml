name: HermetiCore CI

on:
  push:
    branches: [ main ]
    paths:
      - 'setup.ps1'
      - '.skills/hermeticore-runtimes/**'
      - '.github/workflows/**'
      - '.github/workflows/hermeticore-ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel stale runs on the same branch to save quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════
  # TIER 1 — Infrastructure smoke test
  # Validates: 7zip, aria2c, git, node.exe, python.exe, pip.exe
  # ══════════════════════════════════════════════════════════════════
  tier1-infrastructure:
    name: "Tier 1 — Infrastructure Setup"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tier 1 Setup (setup.ps1)
        shell: pwsh
        run: |
          Write-Host "=============================="
          Write-Host " HermetiCore Tier 1 Bootstrap"
          Write-Host " OS: windows-latest | Arch: AMD64"
          Write-Host "=============================="
          ./setup.ps1

      - name: Validate — Node.js isolation & version
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'hostedtoolcache|Program Files|WindowsApps' }) -join ';'
          $env:PATH = "$pwd\tools\node;$env:PATH"
          $nodePath = (Get-Command node -ErrorAction Stop).Source
          Write-Host "[DEBUG] node: $nodePath"
          if ($nodePath -notmatch '\\tools\\') { Write-Error "ISOLATION BREACH: $nodePath"; exit 1 }
          $ver = node -v; Write-Host "[DEBUG] node version: $ver"
          if ([string]::IsNullOrWhiteSpace($ver)) { Write-Error "Empty version"; exit 1 }
          Write-Host "[PASS] Node.js OK"

      - name: Validate — Python + pip isolation
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'hostedtoolcache|Program Files|WindowsApps' }) -join ';'
          $env:PATH = "$pwd\tools\python;$pwd\tools\python\Scripts;$env:PATH"
          $env:PYTHONNOUSERSITE = '1'
          $pyPath = (Get-Command python -ErrorAction Stop).Source
          Write-Host "[DEBUG] python: $pyPath"
          if ($pyPath -notmatch '\\tools\\') { Write-Error "ISOLATION BREACH: $pyPath"; exit 1 }
          $ver = python --version 2>&1; Write-Host "[DEBUG] version: $ver"
          if ($ver -notmatch 'Python 3\.\d+') { Write-Error "Wrong version: $ver"; exit 1 }
          $pipPath = (Get-Command pip -ErrorAction Stop).Source
          Write-Host "[DEBUG] pip: $pipPath"
          $site = python -c "import site; print(site.getsitepackages()[0])"
          Write-Host "[DEBUG] site-packages: $site"
          if ($site -match 'runneradmin|hostedtoolcache') { Write-Error "Site-packages leak: $site"; exit 1 }
          Write-Host "[PASS] Python 3.12 + pip OK"

      - name: Validate — Git portable
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'hostedtoolcache|Program Files|WindowsApps' }) -join ';'
          $env:PATH = "$pwd\tools\git\cmd;$env:PATH"
          $gitPath = (Get-Command git -ErrorAction Stop).Source
          Write-Host "[DEBUG] git: $gitPath"
          if ($gitPath -notmatch '\\tools\\') { Write-Error "ISOLATION BREACH: $gitPath"; exit 1 }
          $ver = git --version; Write-Host "[DEBUG] $ver"
          Write-Host "[PASS] Git portable OK"

      - name: Upload Tier 1 tools as artifact (reuse in Tier 2)
        uses: actions/upload-artifact@v4
        with:
          name: tier1-tools
          path: |
            tools/7zip/
            tools/aria2/
            tools/git/
            tools/node/
            tools/python/
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════
  # RULES LINTER — fast, linux, no download needed
  # ══════════════════════════════════════════════════════════════════
  rules-linter:
    name: "Rules Compliance Linter"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint — No bare Invoke-WebRequest for binary downloads in .ps1 files
        run: |
          echo "Scanning for banned Invoke-WebRequest -OutFile usage in PowerShell scripts..."
          echo "(Rule: binary file downloads must use aria2c. API/metadata fetches are allowed.)"
          # Only flag -OutFile downloads (binary files), not API/metadata fetches
          VIOLATIONS=$(grep -rn "Invoke-WebRequest.*-OutFile\|-OutFile.*Invoke-WebRequest" --include="*.ps1" . \
            | grep -v "setup\.ps1" \
            | grep -v "# EXCEPTION" \
            | grep -v "# BANNED" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ FAIL: Invoke-WebRequest -OutFile (binary download) found in non-exempt .ps1 files:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use aria2c instead: & \$aria2 -x 8 -s 8 -d \$dir -o \$file \$url"
            exit 1
          fi
          echo "✅ PASS: No banned binary Invoke-WebRequest downloads found."

      - name: Lint — No dead file references in rule docs
        run: |
          if grep -q "logs/AI_MULTI_AGENT_LOG.md" AI_BOOTSTRAP_PROTOCOL.md 2>/dev/null; then
            echo "❌ Dead reference: logs/AI_MULTI_AGENT_LOG.md in AI_BOOTSTRAP_PROTOCOL.md"
            exit 1
          fi
          echo "✅ No dead file references"

      - name: Lint — Recent commits have [AI:] prefix
        run: |
          MISSING=$(git log --no-merges --oneline -5 --format="%s" | grep -v "^\[AI:" | grep -v "^Merge" || true)
          if [ -n "$MISSING" ]; then
            echo "⚠️ Commits missing [AI:] prefix (warning only):"
            echo "$MISSING"
          else
            echo "✅ All recent commits have [AI:] prefix"
          fi
