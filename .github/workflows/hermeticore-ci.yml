name: HermetiCore CI

on:
  push:
    branches: [ main ]
    paths:
      - 'setup.ps1'
      - 'config/mcp_fleet.json'
      - '.skills/hermeticore-runtimes/**'
      - '.github/workflows/**'
      - '.github/workflows/hermeticore-ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel stale runs on the same branch to save quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════
  # TIER 1 — Infrastructure smoke test
  # Validates: 7zip, aria2c, git, node.exe, python.exe, pip.exe, MCP Fleet
  # ══════════════════════════════════════════════════════════════════
  tier1-infrastructure:
    name: "Tier 1 — Infrastructure Setup"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tier 1 Setup (setup.ps1)
        shell: pwsh
        run: |
          Write-Host "=============================="
          Write-Host " HermetiCore Tier 1 Bootstrap"
          Write-Host " OS: windows-latest | Arch: AMD64"
          Write-Host "=============================="
          ./setup.ps1

      - name: Validate — 7-Zip & Aria2c Portable
        shell: pwsh
        run: |
          $7zExe = "tools\7zip\7za.exe"
          $ariaExe = "tools\aria2\aria2c.exe"
          if (-not (Test-Path $7zExe)) { Write-Error "7-Zip binary missing at $7zExe"; exit 1 }
          if (-not (Test-Path $ariaExe)) { Write-Error "Aria2c binary missing at $ariaExe"; exit 1 }
          & $7zExe --help 2>&1 | Select-Object -First 2 | Write-Host
          & $ariaExe --version | Select-Object -First 1 | Write-Host
          Write-Host "[PASS] 7-Zip & Aria2c OK"

      - name: Validate — Node.js isolation & version
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'hostedtoolcache|Program Files|WindowsApps' }) -join ';'
          $env:PATH = "$pwd\tools\node;$env:PATH"
          $nodePath = (Get-Command node -ErrorAction Stop).Source
          Write-Host "[DEBUG] node: $nodePath"
          if ($nodePath -notmatch '\\tools\\') { Write-Error "ISOLATION BREACH: $nodePath"; exit 1 }
          $ver = node -v; Write-Host "[DEBUG] node version: $ver"
          if ([string]::IsNullOrWhiteSpace($ver)) { Write-Error "Empty version"; exit 1 }
          Write-Host "[PASS] Node.js OK"

      - name: Validate — Python + pip isolation
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'hostedtoolcache|Program Files|WindowsApps' }) -join ';'
          $env:PATH = "$pwd\tools\python;$pwd\tools\python\Scripts;$env:PATH"
          $env:PYTHONNOUSERSITE = '1'
          $pyPath = (Get-Command python -ErrorAction Stop).Source
          Write-Host "[DEBUG] python: $pyPath"
          if ($pyPath -notmatch '\\tools\\') { Write-Error "ISOLATION BREACH: $pyPath"; exit 1 }
          $ver = python --version 2>&1; Write-Host "[DEBUG] version: $ver"
          if ($ver -notmatch 'Python 3\.\d+') { Write-Error "Wrong version: $ver"; exit 1 }
          $pipPath = (Get-Command pip -ErrorAction Stop).Source
          Write-Host "[DEBUG] pip: $pipPath"
          $site = python -c "import site; print(site.getsitepackages()[0])"
          Write-Host "[DEBUG] site-packages: $site"
          if ($site -match 'runneradmin|hostedtoolcache') { Write-Error "Site-packages leak: $site"; exit 1 }
          Write-Host "[PASS] Python 3.12 + pip OK"

      - name: Validate — Git portable
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'hostedtoolcache|Program Files|WindowsApps' }) -join ';'
          $env:PATH = "$pwd\tools\git\cmd;$env:PATH"
          $gitPath = (Get-Command git -ErrorAction Stop).Source
          Write-Host "[DEBUG] git: $gitPath"
          if ($gitPath -notmatch '\\tools\\') { Write-Error "ISOLATION BREACH: $gitPath"; exit 1 }
          $ver = git --version; Write-Host "[DEBUG] $ver"
          Write-Host "[PASS] Git portable OK"

      - name: Validate — Local MCP Fleet & Antigravity Plugins
        shell: pwsh
        run: |
          Write-Host "=== Validating Tier-1 Local MCP Fleet ==="
          $mcpFleetFile = "config\mcp_fleet.json"
          if (-not (Test-Path $mcpFleetFile)) { Write-Error "Missing $mcpFleetFile"; exit 1 }
          $mcpFleet = Get-Content $mcpFleetFile -Raw | ConvertFrom-Json
          $nodeExe = "tools\node\node.exe"

          foreach ($mcp in $mcpFleet) {
              Write-Host "Checking MCP: $($mcp.name)..."
              $pluginDir = ".agents\plugins\$($mcp.name)"
              $configFile = "$pluginDir\mcp_config.json"
              $metaFile = "$pluginDir\plugin.json"
              
              if (-not (Test-Path $pluginDir)) { Write-Error "Plugin directory missing: $pluginDir"; exit 1 }
              if (-not (Test-Path $configFile)) { Write-Error "mcp_config.json missing in $pluginDir"; exit 1 }
              if (-not (Test-Path $metaFile)) { Write-Error "plugin.json missing in $pluginDir"; exit 1 }

              # Validate JSON syntax
              $cfg = Get-Content $configFile -Raw | ConvertFrom-Json
              $meta = Get-Content $metaFile -Raw | ConvertFrom-Json
              if ($null -eq $cfg.mcpServers.$($mcp.name)) { Write-Error "Malformed mcp_config.json for $($mcp.name)"; exit 1 }

              # Validate entrypoint file exists
              $entrypoint = $mcp.entrypoint
              if (-not (Test-Path $entrypoint)) { Write-Error "Entrypoint missing for $($mcp.name): $entrypoint"; exit 1 }
              Write-Host "  [OK] $($mcp.name) plugin & entrypoint verified."
          }
          Write-Host "[PASS] All Tier-1 MCP Plugins Verified."

      - name: Upload Tier 1 tools as artifact (reuse in Tier 2)
        uses: actions/upload-artifact@v4
        with:
          name: tier1-tools
          path: |
            tools/7zip/
            tools/aria2/
            tools/git/
            tools/node/
            tools/python/
            tools/mcp-servers/
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════
  # TIER 2a — Node.js scaffold test
  # Creates a mock project, runs Runtime-Node.ps1, validates node.exe
  # ══════════════════════════════════════════════════════════════════
  tier2-node:
    name: "Tier 2a — Node.js Scaffold"
    needs: tier1-infrastructure
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Tier 1 tools
        uses: actions/download-artifact@v4
        with:
          name: tier1-tools
          path: tools/

      - name: Create mock project fixture (in-RAM, no external repo)
        shell: pwsh
        run: |
          # Generate a minimal project layout inline — no network, no external repo needed
          $proj = "projects\ci-test-node"
          New-Item -ItemType Directory -Path $proj -Force | Out-Null
          New-Item -ItemType Directory -Path "$proj\src" -Force | Out-Null
          '{"name":"ci-test","version":"1.0.0","main":"src/server.js"}' | Set-Content "$proj\package.json"
          'console.log("node ok:", process.version)' | Set-Content "$proj\src\server.js"
          Write-Host "[OK] Mock Node project created at $proj"

      - name: Run Runtime-Node.ps1 scaffolder
        shell: pwsh
        run: |
          & ".\.skills\hermeticore-runtimes\Runtime-Node.ps1" -TargetProjectName "ci-test-node" -NodeVersion "20.17.0"

      - name: Validate Node scaffold
        shell: pwsh
        run: |
          $nodeExe = "projects\ci-test-node\runtime\tools\node\node.exe"
          if (-not (Test-Path $nodeExe)) { Write-Error "node.exe missing at $nodeExe"; exit 1 }
          $ver = & $nodeExe -v; Write-Host "[DEBUG] Scaffold node version: $ver"
          if ($ver -notmatch 'v20\.17') { Write-Error "Wrong version: $ver"; exit 1 }
          # Run the mock server
          $out = & $nodeExe "projects\ci-test-node\src\server.js" 2>&1
          Write-Host "[DEBUG] Server output: $out"
          if ($out -notmatch 'node ok:') { Write-Error "Server did not run correctly"; exit 1 }
          Write-Host "[PASS] Node.js Tier 2 scaffold OK"

  # ══════════════════════════════════════════════════════════════════
  # TIER 2b — Python scaffold test
  # Creates a mock project, runs Runtime-Python.ps1, validates python+pip
  # ══════════════════════════════════════════════════════════════════
  tier2-python:
    name: "Tier 2b — Python Scaffold"
    needs: tier1-infrastructure
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Tier 1 tools
        uses: actions/download-artifact@v4
        with:
          name: tier1-tools
          path: tools/

      - name: Create mock Python project fixture
        shell: pwsh
        run: |
          $proj = "projects\ci-test-python"
          New-Item -ItemType Directory -Path "$proj\src" -Force | Out-Null
          'print("python ok:", __import__("sys").version)' | Set-Content "$proj\src\main.py"
          Write-Host "[OK] Mock Python project created at $proj"

      - name: Run Runtime-Python.ps1 scaffolder
        shell: pwsh
        run: |
          & ".\.skills\hermeticore-runtimes\Runtime-Python.ps1" -TargetProjectName "ci-test-python" -PythonVersion "3.12.5"

      - name: Validate Python scaffold
        shell: pwsh
        run: |
          $pyExe  = "projects\ci-test-python\runtime\tools\python\python.exe"
          $pipExe = "projects\ci-test-python\runtime\tools\python\Scripts\pip.exe"
          if (-not (Test-Path $pyExe))  { Write-Error "python.exe missing"; exit 1 }
          if (-not (Test-Path $pipExe)) { Write-Error "pip.exe missing";    exit 1 }
          $ver = & $pyExe --version 2>&1; Write-Host "[DEBUG] version: $ver"
          if ($ver -notmatch 'Python 3\.12') { Write-Error "Wrong version: $ver"; exit 1 }
          $out = & $pyExe "projects\ci-test-python\src\main.py" 2>&1
          Write-Host "[DEBUG] Script output: $out"
          if ($out -notmatch 'python ok:') { Write-Error "Script failed"; exit 1 }
          Write-Host "[PASS] Python Tier 2 scaffold OK"

  # ══════════════════════════════════════════════════════════════════
  # TIER 2c — Python + CUDA scaffold test
  # No GPU on GitHub runners — validates DLL file presence only
  # Full runtime test requires self-hosted GPU runner (manual dispatch)
  # ══════════════════════════════════════════════════════════════════
  tier2-cuda:
    name: "Tier 2c — Python+CUDA Scaffold (DLL check only)"
    needs: tier1-infrastructure
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Tier 1 tools
        uses: actions/download-artifact@v4
        with:
          name: tier1-tools
          path: tools/

      - name: Create mock CUDA project fixture
        shell: pwsh
        run: |
          $proj = "projects\ci-test-cuda"
          New-Item -ItemType Directory -Path "$proj\src" -Force | Out-Null
          'import sys; print("cuda scaffold ok:", sys.version)' | Set-Content "$proj\src\main.py"
          Write-Host "[OK] Mock CUDA project created at $proj"

      - name: Run Runtime-Python-CUDA.ps1 scaffolder
        shell: pwsh
        run: |
          & ".\.skills\hermeticore-runtimes\Runtime-Python-CUDA.ps1" `
            -TargetProjectName "ci-test-cuda" `
            -PythonVersion "3.12.5" `
            -CudaVersion "12.1.1"
        continue-on-error: true  # CUDA DLLs are large — flag but don't block

      - name: Validate CUDA scaffold (DLL presence, no GPU required)
        shell: pwsh
        run: |
          $cudaBin = "projects\ci-test-cuda\runtime\tools\nvidia\bin"
          $pyExe   = "projects\ci-test-cuda\runtime\tools\python\python.exe"

          Write-Host "=== CUDA Scaffold Validation (headless/no-GPU) ==="

          # Python must always exist
          if (-not (Test-Path $pyExe)) { Write-Error "python.exe missing in CUDA scaffold"; exit 1 }
          $ver = & $pyExe --version 2>&1; Write-Host "[DEBUG] Python: $ver"

          # CUDA DLLs: check presence (cannot execute without GPU)
          if (Test-Path $cudaBin) {
              $dlls = Get-ChildItem $cudaBin -Filter "*.dll" | Select-Object -ExpandProperty Name
              Write-Host "[DEBUG] CUDA DLLs found: $($dlls.Count)"
              $dlls | ForEach-Object { Write-Host "  $_" }
              if ($dlls.Count -eq 0) {
                  Write-Host "::warning::No CUDA DLLs found in $cudaBin — CUDA download may have failed"
              } else {
                  Write-Host "[PASS] CUDA DLLs present ($($dlls.Count) files)"
              }
          } else {
              Write-Host "::warning::CUDA bin dir missing — skipped (no GPU runner, CUDA download may be large)"
          }
          Write-Host "[PASS] Python+CUDA scaffold validated (GPU execution requires self-hosted runner)"

  # ══════════════════════════════════════════════════════════════════
  # RULES LINTER — fast, linux, no download needed
  # ══════════════════════════════════════════════════════════════════
  rules-linter:
    name: "Rules Compliance Linter"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint — No bare Invoke-WebRequest for binary downloads in .ps1 files
        run: |
          echo "Scanning for banned Invoke-WebRequest -OutFile usage in PowerShell scripts..."
          echo "(Rule: binary file downloads must use aria2c. API/metadata fetches are allowed.)"
          # Only flag -OutFile downloads (binary files), not API/metadata fetches
          VIOLATIONS=$(grep -rn "Invoke-WebRequest.*-OutFile\|-OutFile.*Invoke-WebRequest" --include="*.ps1" . \
            | grep -v "setup\.ps1" \
            | grep -v "# EXCEPTION" \
            | grep -v "# BANNED" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ FAIL: Invoke-WebRequest -OutFile (binary download) found in non-exempt .ps1 files:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use aria2c instead: & \$aria2 -x 8 -s 8 -d \$dir -o \$file \$url"
            exit 1
          fi
          echo "✅ PASS: No banned binary Invoke-WebRequest downloads found."

      - name: Lint — No dead file references in rule docs
        run: |
          if grep -q "logs/AI_MULTI_AGENT_LOG.md" AI_BOOTSTRAP_PROTOCOL.md 2>/dev/null; then
            echo "❌ Dead reference: logs/AI_MULTI_AGENT_LOG.md in AI_BOOTSTRAP_PROTOCOL.md"
            exit 1
          fi
          echo "✅ No dead file references"

      - name: Lint — Recent commits have [AI:] prefix
        run: |
          MISSING=$(git log --no-merges --oneline -5 --format="%s" | grep -v "^\[AI:" | grep -v "^Merge" || true)
          if [ -n "$MISSING" ]; then
            echo "⚠️ Commits missing [AI:] prefix (warning only):"
            echo "$MISSING"
          else
            echo "✅ All recent commits have [AI:] prefix"
          fi
