name: HermetiCore Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-matrix-test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    name: Windows CI (${{ matrix.shell }})
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Hydrate HermetiCore Tier 1 Toolchains
        run: ${{ matrix.shell }} -File .\setup.ps1

      - name: Execute ADHD 6-Model Stress Test Matrix
        run: ${{ matrix.shell }} -File .\tests\run_adhd_test_matrix.ps1
